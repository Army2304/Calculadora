<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Precio de Venta 💰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .emoji {
      font-size: 2rem;
    }
    .result-box {
      background-color: #e6f7ff;
      border-left: 5px solid #0d6efd;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4 animate__animated animate__fadeInUp">
      <h2 class="text-center mb-4">Calculadora de Precio de Venta 💵</h2>
      <form id="calcForm">
        <div class="mb-3">
          <label for="cost" class="form-label">Costo base del producto (MXN) 🛒</label>
          <input type="number" step="0.01" class="form-control" id="cost" required />
        </div>
        <div class="mb-3">
          <label for="profit" class="form-label">Porcentaje de ganancia deseado (%) 📈</label>
          <input type="number" step="0.1" class="form-control" id="profit" required />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Calcular Precio Final 🚀</button>
        </div>
      </form>
      <div id="result" class="result-box mt-4 d-none animate__animated">
        <p class="fs-5 mb-1">💰 <strong>Precio final sugerido:</strong> <span id="finalPrice"></span></p>
        <p class="fs-6">📊 <strong>Ganancia neta:</strong> <span id="netProfit"></span></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('calcForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const cost = parseFloat(document.getElementById('cost').value);
      const profitPercent = parseFloat(document.getElementById('profit').value);

      if (isNaN(cost) || isNaN(profitPercent) || cost <= 0 || profitPercent < 0) {
        alert('Por favor ingresa valores válidos.');
        return;
      }

      const finalPrice = cost + (cost * profitPercent / 100);
      const netProfit = finalPrice - cost;

      document.getElementById('finalPrice').textContent = `$${finalPrice.toFixed(2)}`;
      document.getElementById('netProfit').textContent = `$${netProfit.toFixed(2)}`;

      const resultBox = document.getElementById('result');
      resultBox.classList.remove('d-none', 'animate__fadeOut');
      resultBox.classList.add('animate__fadeIn');
    });
  </script>
</body>
</html>
